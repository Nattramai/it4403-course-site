<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 Exercise 5 - Visual Effects</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f5f6f8; color: #1b1b1b; }
    .wrap { width: min(900px, calc(100% - 40px)); margin: 40px auto; }
    .card { background: white; border: 1px solid #d8dce2; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    button, select, input { font: inherit; padding: 10px 12px; margin: 6px 6px 6px 0; }
    button { cursor: pointer; }
    .result { margin-top: 15px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #bbb; padding: 10px; text-align: left; }
    img { max-width: 100%; border-radius: 8px; }
    .thumb { width: 120px; height: 80px; object-fit: cover; cursor: pointer; margin: 5px; border: 2px solid transparent; }
    .error { color: #a00000; }
    a { color: #1f5d92; }
  </style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Exercise 5: jQuery Visual Effects</h1>
<button id="hideBox">Hide</button>
<button id="showBox">Show</button>
<button id="toggleBox">Toggle</button>
<button id="fadeBox">Fade Toggle</button>
<button id="slideBox">Slide Toggle</button>
<div id="effectBox" style="margin-top:20px;padding:30px;background:#e8e8e8;border:1px solid #999;">
This box demonstrates jQuery visual effects.
</div>
</div>
<script>
$(function () {
  $("#hideBox").click(function () { $("#effectBox").hide(); });
  $("#showBox").click(function () { $("#effectBox").show(); });
  $("#toggleBox").click(function () { $("#effectBox").toggle(); });
  $("#fadeBox").click(function () { $("#effectBox").fadeToggle(500); });
  $("#slideBox").click(function () { $("#effectBox").slideToggle(500); });
});
</script>
</div>
</body>
</html>
