<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 Exercise 4 - Table Selection</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f5f6f8; color: #1b1b1b; }
    .wrap { width: min(900px, calc(100% - 40px)); margin: 40px auto; }
    .card { background: white; border: 1px solid #d8dce2; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    button, select, input { font: inherit; padding: 10px 12px; margin: 6px 6px 6px 0; }
    button { cursor: pointer; }
    .result { margin-top: 15px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #bbb; padding: 10px; text-align: left; }
    img { max-width: 100%; border-radius: 8px; }
    .thumb { width: 120px; height: 80px; object-fit: cover; cursor: pointer; margin: 5px; border: 2px solid transparent; }
    .error { color: #a00000; }
    a { color: #1f5d92; }
  </style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Exercise 4: Table Selection and Event Handling</h1>
<button id="styleOdd">Style Odd Rows</button>
<button id="hideOdd">Hide Odd Rows</button>
<button id="restoreRows">Restore Hidden Rows</button>
<table id="studentTable">
<thead><tr><th>Name</th><th>Major</th><th>Year</th></tr></thead>
<tbody>
<tr><td>Alex</td><td>IT</td><td>Senior</td></tr>
<tr><td>Jordan</td><td>Cybersecurity</td><td>Junior</td></tr>
<tr><td>Taylor</td><td>Computer Science</td><td>Senior</td></tr>
<tr><td>Morgan</td><td>Information Systems</td><td>Sophomore</td></tr>
<tr><td>Casey</td><td>IT</td><td>Junior</td></tr>
</tbody>
</table>
<p>Click any data row to hide only that row.</p>
</div>
<script>
$(function () {
  $("#styleOdd").click(function () {
    $("#studentTable tbody tr:odd").css({"background-color":"#eeeeee","border":"2px solid #444","font-style":"italic"});
  });
  $("#hideOdd").click(function () { $("#studentTable tbody tr:odd").hide(); });
  $("#restoreRows").click(function () { $("#studentTable tbody tr").show(); });
  $("#studentTable tbody tr").click(function () { $(this).hide(); });
});
</script>
</div>
</body>
</html>
