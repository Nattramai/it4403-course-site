<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 Exercise 2 - ready() and Events</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f5f6f8; color: #1b1b1b; }
    .wrap { width: min(900px, calc(100% - 40px)); margin: 40px auto; }
    .card { background: white; border: 1px solid #d8dce2; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    button, select, input { font: inherit; padding: 10px 12px; margin: 6px 6px 6px 0; }
    button { cursor: pointer; }
    .result { margin-top: 15px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #bbb; padding: 10px; text-align: left; }
    img { max-width: 100%; border-radius: 8px; }
    .thumb { width: 120px; height: 80px; object-fit: cover; cursor: pointer; margin: 5px; border: 2px solid transparent; }
    .error { color: #a00000; }
    a { color: #1f5d92; }
  </style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Exercise 2: jQuery ready() and Event Handling</h1>
<p id="p1">This is the first paragraph.</p>
<p id="p2">This is the second paragraph.</p>
<button id="hide1">Hide First Paragraph</button>
<button id="hide2">Hide Second Paragraph</button>
<button id="reset">Show Both</button>
</div>
<script>
$(document).ready(function () {
  $("#hide1").click(function () { $("#p1").hide(); });
  $("#hide2").click(function () { $("#p2").hide(); });
  $("#reset").click(function () { $("#p1, #p2").show(); });
});
</script>
</div>
</body>
</html>
