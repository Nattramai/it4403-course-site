<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 Exercise 6 - Calculator</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f5f6f8; color: #1b1b1b; }
    .wrap { width: min(900px, calc(100% - 40px)); margin: 40px auto; }
    .card { background: white; border: 1px solid #d8dce2; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    button, select, input { font: inherit; padding: 10px 12px; margin: 6px 6px 6px 0; }
    button { cursor: pointer; }
    .result { margin-top: 15px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th, td { border: 1px solid #bbb; padding: 10px; text-align: left; }
    img { max-width: 100%; border-radius: 8px; }
    .thumb { width: 120px; height: 80px; object-fit: cover; cursor: pointer; margin: 5px; border: 2px solid transparent; }
    .error { color: #a00000; }
    a { color: #1f5d92; }
  </style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Exercise 6: jQuery Calculator Application</h1>
<label>First number<br><input id="num1" type="text"></label><br>
<label>Second number<br><input id="num2" type="text"></label><br>
<label>Operation<br>
<select id="operation">
<option value="+">Addition (+)</option>
<option value="-">Subtraction (-)</option>
<option value="*">Multiplication (*)</option>
<option value="/">Division (/)</option>
</select>
</label><br>
<label>Result color<br><input id="resultColor" type="text" placeholder="red, blue, green"></label><br>
<button id="calculate">Calculate</button>
<div id="calcMessage" class="result"></div>
</div>
<script>
$(function () {
  $("#calculate").click(function () {
    const raw1 = $("#num1").val().trim();
    const raw2 = $("#num2").val().trim();
    const op = $("#operation").val();
    const color = $("#resultColor").val().trim() || "black";
    const $message = $("#calcMessage");
    $message.removeClass("error").css("color", "black");
    if (raw1 === "" || raw2 === "") {
      $message.addClass("error").text("Both number fields must contain values."); return;
    }
    const n1 = Number(raw1), n2 = Number(raw2);
    if (Number.isNaN(n1) || Number.isNaN(n2)) {
      $message.addClass("error").text("Both entries must be valid numbers."); return;
    }
    if (op === "/" && n2 === 0) {
      $message.addClass("error").text("Division by zero is not allowed."); return;
    }
    let result;
    if (op === "+") result = n1 + n2;
    if (op === "-") result = n1 - n2;
    if (op === "*") result = n1 * n2;
    if (op === "/") result = n1 / n2;
    $message.css("color", color).text("Result: " + result);
  });
});
</script>
</div>
</body>
</html>
